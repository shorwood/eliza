# Generate later release notes from tagged commits, including direct commits
# without PRs. The same Markdown becomes the release body and a download.
[changelog]
body = """
## {{ version }}

{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group }}

{% for commit in commits -%}
- {% if commit.breaking and group != "Breaking changes" %}**Breaking:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/shorwood/eliza/commit/{{ commit.id }}))
{% endfor -%}
{{ "\n" }}{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^.*!:", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^build", group = "Distribution" },
  { message = "^docs", group = "Documentation" },
  { message = ".*", group = "Maintenance" },
]
