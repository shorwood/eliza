# Eliza is a standalone workspace, so it owns a small nextest profile without
# Nano package filters.

[store]
dir = "target/nextest"

[profile.default]
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "flaky"
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }
leak-timeout = "200ms"
retries = 0

[profile.ci]
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
final-status-level = "slow"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "30s" }
retries = { backoff = "fixed", count = 2, delay = "2s" }

[profile.ci.junit]
path = "junit.xml"
report-name = "eliza"
store-success-output = false
store-failure-output = true
