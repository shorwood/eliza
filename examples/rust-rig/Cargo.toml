[package]
name = "example-rust-rig"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.31"
rig = { package = "rig-core", version = "0.42.0" }
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread"] }

[lints.clippy]
pedantic = "warn"
arbitrary_source_item_ordering = "warn"
