[package]
name = "eliza-benches"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[[bin]]
name = "eliza-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
hdrhistogram = "=7.6.0"
futures-util = "0.3.32"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", features = ["sched", "feature"] }

[dev-dependencies]
audio-codec-algorithms = "=0.8.1"
criterion = "=0.8.2"
eliza-mad = { path = "../crates/eliza-mad" }
eliza-modality-chat = { path = "../crates/modality-chat" }
flite-rs = { version = "=0.2.0", default-features = false }
miette = { version = "7.6.0", features = ["derive"] }
rusty_mp3 = "0.8.0"
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync"] }

[[bench]]
name = "generation"
harness = false

[[bench]]
name = "completion"
harness = false

[[bench]]
name = "speech"
harness = false

[lints]
workspace = true
