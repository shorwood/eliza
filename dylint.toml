[rlib-lint]

# Maximum lines in one undocumented function phase.
function-phase-lines-threshold = 15

# Maximum nested control-flow depth.
control-flow-depth-threshold = 4

# Maximum source lines in one match arm.
match-arm-lines-threshold = 15

# Maximum calls in one method chain.
method-chain-calls-threshold = 5

# Maximum declarations grouped under one section.
declarations-per-section-threshold = 40

# Maximum methods before an extension trait is split.
extension-trait-methods-threshold = 8

# Property prefixes accepted for boolean fields and callable results.
boolean-predicate-prefixes = [".."]

# Standard query roots accepted only for boolean-result callables.
boolean-query-roots = [".."]

# Published Bon builders and their established required members.
bon-api-baseline = []

# Maximum setup statements in one Leptos component.
leptos-setup-statements-threshold = 8

# Maximum reactive primitives in one Leptos component.
leptos-reactive-primitives-threshold = 4

# Maximum statements in one Leptos event handler.
leptos-event-handler-statements-threshold = 3

# Maximum control-flow depth in one Leptos event handler.
leptos-event-handler-control-flow-depth-threshold = 1

# Maximum element nesting depth in a Leptos view.
leptos-view-nesting-depth-threshold = 7

# Maximum control-flow depth in one Leptos view.
leptos-view-control-flow-depth-threshold = 3

# Maximum component nesting depth in one Leptos view.
leptos-component-composition-depth-threshold = 10

# Maximum non-children props on one Leptos component.
leptos-component-props-threshold = 6

# Maximum Leptos components declared in one module.
leptos-components-per-module-threshold = 8

# Minimum nodes required to recognize a repeated view fragment.
leptos-repeated-view-fragment-nodes-threshold = 6

# Minimum occurrences required to recognize a repeated view fragment.
leptos-repeated-view-fragment-occurrences-threshold = 2

# Maximum complexity before a Leptos view needs section comments.
leptos-unnamed-view-complexity-threshold = 4

# Maximum complexity inside one named Leptos view section.
leptos-view-section-complexity-threshold = 4

# Maximum attribute complexity before a group needs a comment.
leptos-unnamed-view-attribute-complexity-threshold = 6

# Maximum complexity inside one named view attribute group.
leptos-view-attribute-group-complexity-threshold = 4

# Maximum formatted line width for Leptos views.
leptos-view-max-width = 100

# Maximum formatted line width for Leptos CSS.
leptos-css-max-width = 100

# Sensitive server-call terms; ".." retains the built-in vocabulary.
leptos-sensitive-call-terms = [".."]

# Functions recognized as Leptos authorization boundaries.
leptos-authorization-functions = []

# Attributes that mark protected Leptos server endpoints.
leptos-protected-endpoint-attributes = []

# Attributes that mark intentionally public Leptos server endpoints.
leptos-public-endpoint-attributes = []

# Generic diagnostic help phrases; ".." retains the built-in vocabulary.
miette-generic-help-phrases = [".."]
