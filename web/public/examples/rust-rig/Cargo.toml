[package]
name = "eliza-public-rig-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.100"
futures-util = "0.3.31"
rig = { package = "rig-core", version = "=0.42.0" }
tokio = { version = "1.52.0", features = ["macros", "rt-multi-thread", "time"] }

[lints.clippy]
pedantic = "warn"
arbitrary_source_item_ordering = "warn"
