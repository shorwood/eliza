[package]
name = "eliza-server-openai"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
derive_more = { version = "2.1.1", features = ["from"] }
aide = { version = "0.15.1", features = ["axum", "axum-json"] }
axum = "0.8.9"
base64 = "0.22.1"
eliza-http = { path = "../http" }
eliza-modality-chat = { path = "../modality-chat" }
eliza-modality-embedding = { path = "../modality-embedding" }
eliza-modality-image = { path = "../modality-image" }
eliza-modality-speech = { path = "../modality-speech" }
futures-util = "0.3"
miette = { version = "7.6.0", features = ["derive"] }
schemars = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["time"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[lints]
workspace = true
