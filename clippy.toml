# Standalone side-project lint config.
#
# The root repository config intentionally disallows standard types that active
# Nano crates replace with Nano-owned semantic wrappers. This package must not
# depend on Nano crates, so those root disallow lists do not apply here.

msrv = "1.94"
too-large-for-stack = 200
too-many-lines-threshold = 80
cognitive-complexity-threshold = 25
allow-mixed-uninlined-format-args = false
avoid-breaking-exported-api = false
check-private-items = true
source-item-ordering = ["module"]
module-item-order-groupings = [
    ["modules", ["extern_crate", "mod", "foreign_mod"]],
    ["use", ["use"]],
    ["body", [
        "macro", "global_asm", "static", "const",
        "ty_alias", "enum", "struct", "union",
        "trait", "trait_alias", "impl", "fn",
    ]],
]
module-items-ordered-within-groupings = "none"

disallowed-names = [
    "foo", "bar", "baz", "qux", "quux",
    "tmp", "temp",
    "val", "v2", "v3",
    "thing", "stuff",
    "x", "y", "z",
]

disallowed-methods = []
disallowed-types = []
disallowed-macros = []
