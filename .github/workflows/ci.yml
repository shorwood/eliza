name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check source
        run: nix develop --command just ok
      - name: Release checked build artifacts
        run: nix develop --command cargo clean
      - name: Check flake
        run: nix flake check
      - name: Benchmark smoke
        run: nix develop --command just bench-smoke
