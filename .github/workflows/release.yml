name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shorwood/eliza

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify public release destination
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility' | grep -qx public
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          if gh api "$package_path" > "$RUNNER_TEMP/package.json"; then
            jq -e '.visibility == "public"' "$RUNNER_TEMP/package.json"
          else
            jq -e '.status == "404"' "$RUNNER_TEMP/package.json"
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME#v}" = "$(nix eval --raw .#eliza.version)"
      - name: Check source
        run: nix develop --command just ok

  image:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and smoke-test image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          nix build .#dockerImage
          docker load --input result
          docker run --rm "eliza:$version" --help
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish architecture image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker tag "eliza:$version" "$IMAGE:$version-${{ matrix.architecture }}"
          docker push "$IMAGE:$version-${{ matrix.architecture }}"
      - name: Verify published package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}" \
            --jq '.visibility' | grep -qx public

  release:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$version-amd64" \
            "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
