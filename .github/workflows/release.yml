# Publish downloads and a multi-architecture container from a version tag.
# The check job gates every build; the release job waits for all smoke tests.
name: Release

# --- Start from a tag, then verify its exact version below.
# The broad trigger lets the check job reject tags such as v1.2.3-rc1.
on:
  push:
    tags:
      - "v*.*.*"

# Serialize retries so two runs cannot replace the same release concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shorwood/eliza

jobs:
  # --- Check the source and publication destinations before making artifacts.
  # A private repository or existing private GHCR package would make the
  # promised public release inaccessible, so either condition stops the run.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # git-cliff needs the previous tag and its commit history.
          fetch-depth: 0
      - name: Verify public release destination
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility' | grep -qx public
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          # GHCR returns 404 before the first push; existing images must be public.
          if gh api "$package_path" > "$RUNNER_TEMP/package.json"; then
            jq -e '.visibility == "public"' "$RUNNER_TEMP/package.json"
          else
            jq -e '.status == "404"' "$RUNNER_TEMP/package.json"
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          # Require a plain version tag matching the version built by Nix.
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${GITHUB_REF_NAME#v}" = "$(nix eval --raw .#eliza.version)"
      - name: Check source
        run: nix develop --command just ok
      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          notes="eliza-$GITHUB_REF_NAME-CHANGELOG.md"
          if [[ "$GITHUB_REF_NAME" == v1.0.0 ]]; then
            cp CHANGELOG.md "$notes"
          else
            nix develop --command git-cliff --current --config cliff.toml --output "$notes"
          fi
          test -s "$notes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-changelog
          path: eliza-*-CHANGELOG.md
          if-no-files-found: error

  # --- Build and push one Linux image for each container architecture.
  # The final job combines these architecture tags into version and latest
  # manifests after the downloads and smoke tests have passed.
  image:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and smoke-test image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          nix build .#dockerImage
          docker load --input result
          # Check the loaded image before it is tagged and pushed to GHCR.
          docker run --rm "eliza:$version" --help
          test "$(docker image inspect "eliza:$version" --format '{{.Architecture}}')" = '${{ matrix.architecture }}'
          mkdir release-assets
          cp -L result "release-assets/eliza-$GITHUB_REF_NAME-docker-${{ matrix.architecture }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-docker-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish architecture image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Keep each image under its own tag until the manifest is ready.
          docker tag "eliza:$version" "$IMAGE:$version-${{ matrix.architecture }}"
          docker push "$IMAGE:$version-${{ matrix.architecture }}"
      - name: Report published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}" \
            --jq '{html_url, visibility}'

  # --- Build each platform's downloads on a compatible runner.
  # Nix checks Linux and macOS outputs on those hosts. Windows is cross-built
  # on Linux, then executed by the separate Windows smoke job below.
  assets:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            output: releaseAssets
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            output: releaseAssets
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            output: releaseAssets
          - runner: macos-15
            platform: macos
            architecture: arm64
            output: releaseAssets
          - runner: ubuntu-24.04
            platform: windows
            architecture: x86_64
            output: releaseWindowsExecutable
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build release downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          nix build -o result-assets '.#${{ matrix.output }}'
          # Artifacts must contain files, not links into the runner's Nix store.
          cp -L result-assets/* release-assets/
      - name: Smoke-test release downloads
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          nix build .#releaseCheck --no-link
          # Linux image jobs build the normal package. ARM macOS exposes one
          # too; Intel macOS intentionally exposes only portable downloads.
          if [[ '${{ matrix.platform }}' == macos && '${{ matrix.architecture }}' == arm64 ]]; then
            nix build .#eliza --no-link
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  # --- Exercise the cross-built executable on an actual Windows runner.
  # Building it on Linux cannot prove that it starts or serves requests there.
  windows-smoke:
    needs: assets
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-x86_64
          path: release-assets
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Get-ChildItem release-assets/*.exe | Select-Object -First 1
          if (-not $binary) { throw 'eliza.exe missing' }
          & $binary.FullName --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'eliza.exe --help failed' }
          $server = Start-Process -FilePath $binary.FullName -ArgumentList 'serve', '--bind', '127.0.0.1:18787' -PassThru -NoNewWindow
          try {
            # Give the server a short startup window before checking health.
            $healthy = $false
            for ($i = 0; $i -lt 50; $i++) {
              try {
                Invoke-WebRequest 'http://127.0.0.1:18787/healthz' -TimeoutSec 1 | Out-Null
                $healthy = $true
                break
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $healthy) { throw 'Windows health check failed' }
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

  # --- Publish only after every image, download, and smoke test succeeds.
  # Re-runs replace existing assets and update the release for the same tag.
  release:
    needs: [image, assets, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release matrix and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          version="${GITHUB_REF_NAME}"
          # DEBT: expose filenames from Nix so this manifest cannot drift from
          # nix/release when a future download format or architecture is added.
          for arch in x86_64 arm64; do
            test -f "eliza-$version-linux-$arch"
            test -f "eliza-$version-macos-$arch.tar.gz"
            test -f "eliza-$version-linux-$arch.deb"
            test -f "eliza-$version-linux-$arch.apk"
          done
          test -f "eliza-$version-windows-x86_64.exe"
          test -f "eliza-$version-docker-amd64.tar.gz"
          test -f "eliza-$version-docker-arm64.tar.gz"
          test -s "eliza-$version-CHANGELOG.md"
          printf '\nSource: https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            >> "eliza-$version-CHANGELOG.md"
          # Nine platform downloads, both Nix image archives, and a changelog.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          # Ship one standard checksum sidecar per downloadable asset.
          for asset in eliza-*; do
            sha256sum "$asset" > "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
      - name: Verify public container access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          # A package does not exist until its first push. Allow its owner to
          # set a newly created package Public before announcing the release.
          gh api "$package_path" --jq '{html_url, visibility}'
          for attempt in {1..120}; do
            if [[ "$(gh api "$package_path" --jq '.visibility')" == public ]]; then
              exit 0
            fi
            echo "Waiting for Public container visibility ($attempt/120)."
            sleep 5
          done
          echo 'Container package must be Public before release publication.' >&2
          exit 1
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Refuse a stale run if somebody moved the tag while builds ran.
          remote_tag=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          if [[ -z "$remote_tag" ]]; then
            remote_tag=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          fi
          test "$remote_tag" = "$GITHUB_SHA"
          # Point the public tags at the two images pushed by the image jobs.
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$version-amd64" \
            "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          notes="release-assets/eliza-$GITHUB_REF_NAME-CHANGELOG.md"

          # Replace the legacy empty release only after all outputs are ready.
          # Keep the tag: it already identifies the checked replacement source.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets --jq '(.isDraft | not) and (.assets | length == 0)' | grep -qx true; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Build a complete draft before making downloads visible. A retry
          # recovers that draft or refreshes a completed release in place.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" --verify-tag --draft
          else
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Check the exact uploaded names before publishing the draft.
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/published-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/published-assets"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
