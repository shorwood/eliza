# Publish downloads and a multi-architecture container from a version tag.
# The check job gates every build; the release job waits for all smoke tests.
name: Release

# --- Start from a tag, then verify its exact version below.
# The broad trigger lets the check job reject tags such as v1.2.3-rc1.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release to repair without moving its tag
        required: true
        default: v1.0.0
        type: string

# Serialize retries so two runs cannot replace the same release concurrently.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shorwood/eliza
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # --- Check the source and publication destinations before making artifacts.
  # A private repository or existing private GHCR package would make the
  # promised public release inaccessible, so either condition stops the run.
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag_commit: ${{ steps.version.outputs.tag_commit }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # git-cliff needs the previous tag and its commit history.
          fetch-depth: 0
      - name: Verify public release destination
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility' | grep -qx public
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          # GHCR returns 404 before the first push; existing images must be public.
          if gh api "$package_path" > "$RUNNER_TEMP/package.json"; then
            jq -e '.visibility == "public"' "$RUNNER_TEMP/package.json"
          else
            jq -e '.status == "404"' "$RUNNER_TEMP/package.json"
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Require a plain version tag matching the version built by Nix.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(nix eval --raw .#eliza.version)"
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then test "$tag_commit" = "$GITHUB_SHA"; fi
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Check source
        run: nix develop --command just ok
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          notes=notes.md
          if [[ "$RELEASE_TAG" == v1.0.0 ]]; then
            cp CHANGELOG.md "$notes"
          else
            nix develop --command git-cliff --current --config cliff.toml --output "$notes"
          fi
          test -s "$notes"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  # --- Build and push one Linux image for each container architecture.
  # The final job combines these architecture tags into version and latest
  # manifests after the downloads and smoke tests have passed.
  image:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and smoke-test image
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          nix build .#dockerImage
          docker load --input result
          # Check the loaded image before it is tagged and pushed to GHCR.
          docker run --rm "eliza:$version" --help
          test "$(docker image inspect "eliza:$version" --format '{{.Architecture}}')" = '${{ matrix.architecture }}'
          container=$(docker create "eliza:$version")
          docker export "$container" | tar -tf - | grep '/share/doc/eliza/licences/flite-rs/NOTICE' >/dev/null
          docker rm "$container"
          mkdir release-assets
          cp -L result "release-assets/eliza-$RELEASE_TAG-docker-${{ matrix.architecture }}.tar.gz"
          find release-assets -maxdepth 1 -type f ! -name 'MANIFEST-*' -printf '%f\n' > release-assets/MANIFEST-docker-${{ matrix.architecture }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-docker-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish architecture image
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Keep each image under its own tag until the manifest is ready.
          docker tag "eliza:$version" "$IMAGE:build-$GITHUB_SHA-${{ matrix.architecture }}"
          docker push "$IMAGE:build-$GITHUB_SHA-${{ matrix.architecture }}"
      - name: Report published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}" \
            --jq '{html_url, visibility}'

  # --- Build each platform's downloads on a compatible runner.
  # Nix checks Linux and macOS outputs on those hosts. Windows is cross-built
  # on Linux, then executed by the separate Windows smoke job below.
  assets:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            architecture: x86_64
            output: releaseAssets
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            output: releaseAssets
          - runner: macos-15-intel
            platform: macos
            architecture: x86_64
            output: releaseAssets
          - runner: macos-15
            platform: macos
            architecture: arm64
            output: releaseAssets
          - runner: ubuntu-24.04
            platform: windows
            architecture: x86_64
            output: releaseWindowsExecutable
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build release downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          nix build -o result-assets '.#${{ matrix.output }}'
          # Artifacts must contain files, not links into the runner's Nix store.
          cp -L result-assets/* release-assets/
          find release-assets -maxdepth 1 -type f ! -name 'MANIFEST-*' -printf '%f\n' > release-assets/MANIFEST-${{ matrix.platform }}-${{ matrix.architecture }}.txt
      - name: Smoke-test release downloads
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          nix build .#releaseCheck --no-link
          # Linux image jobs build the normal package. ARM macOS exposes one
          # too; Intel macOS intentionally exposes only portable downloads.
          if [[ '${{ matrix.platform }}' == macos && '${{ matrix.architecture }}' == arm64 ]]; then
            nix build .#eliza --no-link
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  # --- Exercise the cross-built executable on an actual Windows runner.
  # Building it on Linux cannot prove that it starts or serves requests there.
  windows-smoke:
    needs: assets
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-x86_64
          path: release-assets
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem release-assets/*.zip | Select-Object -First 1
          if (-not $archive) { throw 'Windows archive missing' }
          Expand-Archive $archive.FullName -DestinationPath unpacked
          $notice = Get-ChildItem unpacked -Recurse -Filter NOTICE | Select-Object -First 1
          if (-not $notice -or -not (Select-String -Quiet -Path $notice.FullName -Pattern 'Carnegie Mellon')) { throw 'Speech notice missing' }
          $binary = Get-ChildItem unpacked -Recurse -Filter eliza.exe | Select-Object -First 1
          if (-not $binary) { throw 'eliza.exe missing' }
          & $binary.FullName --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'eliza.exe --help failed' }
          $server = Start-Process -FilePath $binary.FullName -ArgumentList 'serve', '--bind', '127.0.0.1:18787' -PassThru -NoNewWindow
          try {
            # Give the server a short startup window before checking health.
            $healthy = $false
            for ($i = 0; $i -lt 50; $i++) {
              try {
                Invoke-WebRequest 'http://127.0.0.1:18787/healthz' -TimeoutSec 1 | Out-Null
                $healthy = $true
                break
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $healthy) { throw 'Windows health check failed' }
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

  # --- Publish only after every image, download, and smoke test succeeds.
  # Re-runs replace existing assets and update the release for the same tag.
  release:
    needs: [check, image, assets, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: release-notes
      - name: Verify release matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-manifests
          mv release-assets/MANIFEST-*.txt release-manifests/
          cat release-manifests/*.txt | sort > "$RUNNER_TEMP/expected-primary"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/actual-primary"
          diff -u "$RUNNER_TEMP/expected-primary" "$RUNNER_TEMP/actual-primary"
          test -s release-notes/notes.md
          printf '\nBuild source: https://github.com/%s/commit/%s\nOriginal tag source: https://github.com/%s/commit/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "${{ needs.check.outputs.tag_commit }}" >> release-notes/notes.md
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            printf '\nThis release was repaired without moving its Git tag. Replacement downloads and container tags use the build source above and have new digests. Use that commit for matching Nix source builds. Archives include required notices; bare executables require their companion notices archive. Verify downloads with SHA256SUMS.\n' >> release-notes/notes.md
          fi
          jq -n --arg tag "$RELEASE_TAG" --arg source "$GITHUB_SHA" \
            --arg original "${{ needs.check.outputs.tag_commit }}" \
            '{tag: $tag, build_commit: $source, original_tag_commit: $original}' > release-assets/SOURCE.json
          cd release-assets
          while IFS= read -r asset; do
            sha256sum "$asset" > "$RUNNER_TEMP/checksum"
            cp "$RUNNER_TEMP/checksum" "$asset.sha256"
          done < "$RUNNER_TEMP/expected-primary"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          cp "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - name: Verify public container access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package_path="users/$GITHUB_REPOSITORY_OWNER/packages/container/${IMAGE##*/}"
          # A package does not exist until its first push. Allow its owner to
          # set a newly created package Public before announcing the release.
          gh api "$package_path" --jq '{html_url, visibility}'
          for attempt in {1..120}; do
            if [[ "$(gh api "$package_path" --jq '.visibility')" == public ]]; then
              exit 0
            fi
            echo "Waiting for Public container visibility ($attempt/120)."
            sleep 5
          done
          echo 'Container package must be Public before release publication.' >&2
          exit 1
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish manifest and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Refuse a stale run if somebody moved the tag while builds ran.
          remote_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          if [[ -z "$remote_tag" ]]; then
            remote_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)
          fi
          test "$remote_tag" = "${{ needs.check.outputs.tag_commit }}"
          # Point the public tags at the two images pushed by the image jobs.
          docker buildx imagetools create \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            "$IMAGE:build-$GITHUB_SHA-amd64" \
            "$IMAGE:build-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:$version" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          notes=release-notes/notes.md

          # Build a complete draft before making downloads visible. A retry
          # recovers that draft or refreshes a completed release in place.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" --verify-tag --draft
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          # Check the exact uploaded names before publishing the draft.
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/published-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/published-assets"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body | \
            jq -e --rawfile notes "$notes" '(.body | rtrimstr("\n")) == ($notes | rtrimstr("\n"))'
