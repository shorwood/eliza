# One-time recreation from the already built and publicly verified v1.0.0 assets.
# Remove this workflow after the explicit DELETE / 404 / draft / publish checks.
name: Recreate verified initial release

on:
  push:
    branches: [main]
    paths: [.github/workflows/recreate-initial-release.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-refs/tags/v1.0.0
  cancel-in-progress: false

env:
  SOURCE_COMMIT: fb164047baa36b6c589896506e636dcf3ad24686
  RELEASE_RUN: '41434201046'
  PREVIOUS_RELEASE: '402012317'
  RELEASE_TAG: v1.0.0

jobs:
  recreate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Verify source and preserve the complete checked release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = shorwood/eliza
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/build.json"
          jq -e --arg source "$SOURCE_COMMIT" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $source' \
            "$RUNNER_TEMP/build.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/previous-release.json" && \
            jq -e --argjson id "$PREVIOUS_RELEASE" '.id == $id and (.assets | length == 24)' "$RUNNER_TEMP/previous-release.json"; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          else
            # A retry after deletion recovers the verified files saved before it.
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --pattern "verified-release-backup-$GITHUB_RUN_ID-*" --dir "$RUNNER_TEMP/recovery"
            backup=$(find "$RUNNER_TEMP/recovery" -name release.json -type f -print -quit)
            test -n "$backup"
            cp "$backup" "$RUNNER_TEMP/previous-release.json"
            cp -a "${backup%/release.json}/assets" release-assets
          fi
          jq -e --argjson id "$PREVIOUS_RELEASE" --arg source "$SOURCE_COMMIT" \
            '.id == $id and (.draft | not) and (.assets | length == 24) and (.body | contains($source))' \
            "$RUNNER_TEMP/previous-release.json"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 24
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/expected-assets"
          jq -r '.assets[].name' "$RUNNER_TEMP/previous-release.json" | sort > "$RUNNER_TEMP/original-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/original-assets"
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 12
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          cd ..
          mkdir release-backup
          cp -a release-assets release-backup/assets
          cp "$RUNNER_TEMP/previous-release.json" release-backup/release.json
      - name: Retain the verified files and metadata before deletion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-backup/
          if-no-files-found: error
          retention-days: 7
      - name: Explicitly delete the previous release and confirm absence
        shell: bash
        run: |
          set -euo pipefail
          release_path="repos/$GITHUB_REPOSITORY/releases/$PREVIOUS_RELEASE"
          if gh api "$release_path" > "$RUNNER_TEMP/current-release.json"; then
            echo "Deleting verified release ID $PREVIOUS_RELEASE; preserving its Git tag."
            gh api --method DELETE "$release_path" --include
          else
            jq -e '.message == "Not Found" and (.status | tostring) == "404"' "$RUNNER_TEMP/current-release.json"
            echo 'Previous attempt already deleted the old release; resuming.'
          fi
          if gh api "$release_path" > "$RUNNER_TEMP/deleted-release.json" 2> "$RUNNER_TEMP/deleted-release-error"; then
            echo 'The previous release still exists after deletion.' >&2
            exit 1
          fi
          jq -e '.message == "Not Found" and (.status | tostring) == "404"' "$RUNNER_TEMP/deleted-release.json"
          echo 'Confirmed: the deleted release now returns HTTP 404.'
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)" = "$SOURCE_COMMIT"
      - name: Recreate the draft with the verified files and publish
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            jq -n --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" \
              --rawfile notes "release-assets/eliza-$RELEASE_TAG-CHANGELOG.md" \
              '{tag_name: $tag, target_commitish: $source, name: $tag, body: $notes, draft: true}' \
              > "$RUNNER_TEMP/draft-payload.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input "$RUNNER_TEMP/draft-payload.json" > "$RUNNER_TEMP/draft-release.json"
          else
            draft_id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')
            gh api "repos/$GITHUB_REPOSITORY/releases/$draft_id" > "$RUNNER_TEMP/draft-release.json"
          fi
          jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" \
            '.draft == true and .tag_name == $tag and (.body | contains($source))' "$RUNNER_TEMP/draft-release.json"
          jq '{id, tag_name, draft}' "$RUNNER_TEMP/draft-release.json"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/uploaded-assets"
          diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/uploaded-assets"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" \
            '.tag_name == $tag and (.draft | not) and (.assets | length == 24) and (.body | contains($source))' \
            "$RUNNER_TEMP/published-release.json"
          jq '{id, tag_name, published_at, assets: (.assets | length)}' "$RUNNER_TEMP/published-release.json"
          echo 'Verified deletion, HTTP 404, draft creation, and complete publication.'
