[workspace]
resolver = "2"
members = ["examples/rust-rig"]
default-members = ["."]

[workspace.package]
license = "MIT"

[package]
name = "eliza"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "scalar"] }
audio-codec-algorithms = "=0.8.1"
axum = "0.8.9"
base64 = "0.22.1"
bon = "=3.9.3"
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from", "from_str"] }
flite-rs = { version = "=0.2.0", default-features = false }
futures-util = "0.3"
miette = { version = "7.6.0", features = ["derive", "fancy"] }
rusty_mp3 = "0.8.0"
schemars = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[lints.clippy]
pedantic = "warn"
arbitrary_source_item_ordering = "warn"
